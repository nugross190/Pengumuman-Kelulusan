<!doctype html><html lang="id"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#FDF8F0}
body{font-family:sans-serif;background:#FDF8F0;padding:24px;display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.logo-block{display:flex;flex-direction:column;align-items:center;gap:10px}
img{display:block}
.caption{font-size:11px;color:#9C8A78;text-align:center;line-height:1.4;font-family:'DM Sans',sans-serif}
.bg-dark{background:#1C1410;padding:16px;border-radius:10px}
</style></head><body>

<div class="logo-block">
  <img src="../assets/logo-sman5.png" alt="SMAN 5 Garut" width="100" height="100">
  <div class="caption">SMAN 5 Garut<br>Original (white bg)</div>
</div>

<div class="logo-block">
  <img src="../assets/logo-sman5-transparent.png" alt="SMAN 5 Garut Transparent" width="100" height="100">
  <div class="caption">SMAN 5 Garut<br>Transparent</div>
</div>

<div class="logo-block bg-dark">
  <img src="../assets/logo-sman5-transparent.png" alt="SMAN 5 Garut on dark" width="80" height="80">
  <div class="caption" style="color:#9C8A78">On dark bg</div>
</div>

<div class="logo-block" style="background:#FDF8F0;padding:8px;border-radius:8px">
  <img src="../assets/logo-jabar.png?v=2" alt="Logo Jawa Barat" width="80" height="94">
  <div class="caption">Jawa Barat Province<br>Government Logo</div>
</div>
<div class="logo-block bg-dark" style="padding:12px">
  <img src="../assets/logo-jabar.png?v=2" alt="Logo Jawa Barat on dark" width="72" height="85">
  <div class="caption" style="color:#9C8A78">On dark bg</div>
</div>

</body></html>
