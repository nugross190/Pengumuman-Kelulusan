<!doctype html><html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FDF8F0;padding:20px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:stretch}
.swatch{flex:1;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(28,20,16,0.10)}
.color{height:80px}
.meta{background:#fff;padding:8px 10px}
.name{font-size:11px;font-weight:600;letter-spacing:0.06em;color:#1C1410;text-transform:uppercase}
.val{font-family:'JetBrains Mono',monospace;font-size:11px;color:#9C8A78;margin-top:2px}
.label{font-size:11px;color:#5C4E42;margin-top:2px;font-style:italic}
</style></head><body>
<div class="row">
  <div class="swatch"><div class="color" style="background:#C41E1E"></div><div class="meta"><div class="name">Accent Red</div><div class="val">#C41E1E</div><div class="label">--accent · Primary action, stamps</div></div></div>
  <div class="swatch"><div class="color" style="background:#8B1515"></div><div class="meta"><div class="name">Accent Dark</div><div class="val">#8B1515</div><div class="label">--accent-dark · Hover state</div></div></div>
  <div class="swatch"><div class="color" style="background:#FBE5E5"></div><div class="meta"><div class="name">Accent Soft</div><div class="val">#FBE5E5</div><div class="label">--accent-soft · Focus ring tint</div></div></div>
</div>
<div class="row">
  <div class="swatch"><div class="color" style="background:#D4A80F"></div><div class="meta"><div class="name">Gold</div><div class="val">#D4A80F</div><div class="label">--gold · Ornaments, ceremonial</div></div></div>
  <div class="swatch"><div class="color" style="background:#FBF1C7"></div><div class="meta"><div class="name">Gold Soft</div><div class="val">#FBF1C7</div><div class="label">--gold-soft · Modified row bg</div></div></div>
  <div class="swatch"><div class="color" style="background:#8A6A0A"></div><div class="meta"><div class="name">Gold Deep</div><div class="val">#8A6A0A</div><div class="label">--gold-deep · Grade metadata</div></div></div>
</div>
</body></html>
