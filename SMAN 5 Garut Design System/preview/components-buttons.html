<!doctype html><html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FDF8F0;padding:24px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.section-label{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#9C8A78;margin-bottom:6px}

button.primary{font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;letter-spacing:0.04em;background:#C41E1E;color:white;border:none;padding:13px 26px;border-radius:8px;cursor:pointer;box-shadow:0 2px 6px -2px rgba(196,30,30,0.4)}
button.primary:hover{background:#8B1515}
button.primary:disabled{opacity:0.5;cursor:not-allowed}

button.secondary{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.04em;background:#F6EFE0;color:#5C4E42;border:1px solid #E8DDD0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.secondary:hover{background:#1C1410;color:white;border-color:#1C1410}

button.back{display:inline-flex;align-items:center;gap:6px;background:transparent;color:#5C4E42;border:1px solid #C8B89C;border-radius:8px;padding:9px 18px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer}
button.back:hover{background:#1C1410;color:white;border-color:#1C1410}

button.toggle{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.04em;background:transparent;color:#C41E1E;border:1px solid #C41E1E;border-radius:8px;padding:5px 12px;cursor:pointer}
button.toggle:hover{background:#C41E1E;color:white}
</style></head><body>

<div>
  <div class="section-label">Primary Action</div>
  <div class="row">
    <button class="primary">Lihat Pengumuman</button>
    <button class="primary" disabled>Memuat...</button>
  </div>
</div>

<div>
  <div class="section-label">Secondary / Tertiary</div>
  <div class="row">
    <button class="secondary">Reset Semua</button>
    <button class="secondary">Export</button>
    <button class="back">← Kembali</button>
    <button class="back">← Logout</button>
  </div>
</div>

<div>
  <div class="section-label">Table Action</div>
  <div class="row">
    <button class="toggle">Ubah</button>
    <button class="toggle" disabled>Menyimpan...</button>
  </div>
</div>

</body></html>
