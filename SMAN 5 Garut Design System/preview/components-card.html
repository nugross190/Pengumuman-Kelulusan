<!doctype html><html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F6EFE0;padding:24px}
.card{background:#fff;border:1px solid #E8DDD0;border-radius:14px;box-shadow:0 8px 24px -8px rgba(28,20,16,0.18),0 2px 6px -2px rgba(28,20,16,0.06);padding:28px 32px;max-width:480px;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#C41E1E 0%,#C41E1E 60%,#D4A80F 60%,#D4A80F 100%);border-radius:14px 14px 0 0}
.intro{font-size:15px;line-height:1.6;margin:0 0 20px;color:#5C4E42}
.intro strong{color:#1C1410;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#5C4E42;margin-bottom:6px}
.field input{width:100%;background:#F6EFE0;border:1.5px solid transparent;border-radius:8px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:15px;color:#1C1410;outline:none}
.actions{display:flex;align-items:center;gap:14px;margin-top:22px}
button.primary{font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;letter-spacing:0.04em;background:#C41E1E;color:white;border:none;padding:13px 26px;border-radius:8px;cursor:pointer;box-shadow:0 2px 6px -2px rgba(196,30,30,0.4)}
</style></head><body>
<div class="card">
  <p class="intro">Kepada peserta didik kelas <strong>XII</strong>, silakan masukkan <strong>NISN</strong> dan <strong>Nama Lengkap</strong> Anda untuk melihat hasil pengumuman kelulusan secara resmi.</p>
  <div class="field"><label>Nomor Induk Siswa Nasional (NISN)</label><input type="text" placeholder=""></div>
  <div class="field"><label>Nama Lengkap</label><input type="text" placeholder=""></div>
  <div class="actions"><button class="primary">Lihat Pengumuman</button></div>
</div>
</body></html>
