<!doctype html><html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=Playfair+Display:wght@0,900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FDF8F0;padding:24px}
.kop{display:grid;grid-template-columns:60px 1fr 60px;gap:14px;align-items:center;padding-bottom:14px;margin-bottom:0;border-bottom:2px solid #1C1410;position:relative;max-width:640px}
.kop::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:1px;background:#1C1410}
.kop img{width:100%;height:auto;display:block}
.kop-text{text-align:center}
.pem{font-size:11px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#5C4E42;margin:0 0 2px}
.dinas{font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#1C1410;margin:0 0 3px}
.sman{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;letter-spacing:0.02em;text-transform:uppercase;color:#C41E1E;margin:0 0 3px;line-height:1.05}
.alamat{font-size:11px;color:#5C4E42;font-style:italic;margin:0;line-height:1.3}
</style></head><body>
<div class="kop">
  <img src="../assets/logo-jabar.png?v=2" alt="Logo Jawa Barat">
  <div class="kop-text">
    <p class="pem">Pemerintah Daerah Provinsi Jawa Barat</p>
    <p class="dinas">Dinas Pendidikan</p>
    <p class="sman">SMA Negeri 5 Garut</p>
    <p class="alamat">Jl. Raya Bayongbong KM. 09, Garut, Jawa Barat &middot; NPSN: 20227522</p>
  </div>
  <img src="../assets/logo-sman5-transparent.png" alt="Logo SMAN 5 Garut">
</div>
</body></html>
