<!doctype html><html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FDF8F0;padding:20px;display:flex;flex-direction:column;gap:20px}
.section-label{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#9C8A78;margin-bottom:4px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.token{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:#C41E1E;border-radius:3px;width:32px}
.name{font-family:'JetBrains Mono',monospace;font-size:10px;color:#9C8A78;text-align:center}

.radius-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.radius-box{width:50px;height:50px;background:#E8DDD0;border:2px solid #C8B89C;display:flex;align-items:center;justify-content:center}
.rlabel{font-family:'JetBrains Mono',monospace;font-size:9px;color:#5C4E42;text-align:center;margin-top:4px}

.shadow-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.shadow-box{width:60px;height:40px;background:#fff;display:flex;align-items:center;justify-content:center}
.slabel{font-family:'JetBrains Mono',monospace;font-size:9px;color:#5C4E42;text-align:center;margin-top:6px}
</style></head><body>

<div>
<div class="section-label">Spacing Scale</div>
<div class="row">
  <div class="token"><div class="bar" style="height:4px"></div><div class="name">4px<br>--s1</div></div>
  <div class="token"><div class="bar" style="height:8px"></div><div class="name">8px<br>--s2</div></div>
  <div class="token"><div class="bar" style="height:12px"></div><div class="name">12px<br>--s3</div></div>
  <div class="token"><div class="bar" style="height:16px"></div><div class="name">16px<br>--s4</div></div>
  <div class="token"><div class="bar" style="height:20px"></div><div class="name">20px<br>--s5</div></div>
  <div class="token"><div class="bar" style="height:24px"></div><div class="name">24px<br>--s6</div></div>
  <div class="token"><div class="bar" style="height:28px"></div><div class="name">28px<br>--s7</div></div>
  <div class="token"><div class="bar" style="height:32px"></div><div class="name">32px<br>--s8</div></div>
  <div class="token"><div class="bar" style="height:40px"></div><div class="name">40px<br>--s10</div></div>
  <div class="token"><div class="bar" style="height:48px"></div><div class="name">48px<br>--s12</div></div>
</div>
</div>

<div>
<div class="section-label">Border Radius</div>
<div class="radius-row">
  <div class="token"><div class="radius-box" style="border-radius:0px"></div><div class="rlabel">0px<br>none</div></div>
  <div class="token"><div class="radius-box" style="border-radius:8px"></div><div class="rlabel">8px<br>--radius-sm</div></div>
  <div class="token"><div class="radius-box" style="border-radius:14px"></div><div class="rlabel">14px<br>--radius</div></div>
  <div class="token"><div class="radius-box" style="border-radius:6px;width:80px;height:36px"></div><div class="rlabel">6px<br>stamp</div></div>
  <div class="token"><div class="radius-box" style="border-radius:100px;width:80px;height:36px"></div><div class="rlabel">100px<br>pill/badge</div></div>
</div>
</div>

<div>
<div class="section-label">Shadow System</div>
<div class="shadow-row">
  <div class="token">
    <div class="shadow-box" style="box-shadow:0 1px 3px rgba(28,20,16,0.06),0 1px 2px rgba(28,20,16,0.04)"></div>
    <div class="slabel">--shadow-sm<br>default</div>
  </div>
  <div class="token">
    <div class="shadow-box" style="box-shadow:0 4px 12px -4px rgba(28,20,16,0.12),0 1px 4px rgba(28,20,16,0.04)"></div>
    <div class="slabel">--shadow<br>toolbar</div>
  </div>
  <div class="token">
    <div class="shadow-box" style="box-shadow:0 8px 24px -8px rgba(28,20,16,0.18),0 2px 6px -2px rgba(28,20,16,0.06)"></div>
    <div class="slabel">--shadow-lg<br>cards</div>
  </div>
  <div class="token">
    <div class="shadow-box" style="box-shadow:0 0 0 3px #FBE5E5;border:1.5px solid #C41E1E"></div>
    <div class="slabel">--shadow-focus<br>inputs</div>
  </div>
</div>
</div>

</body></html>
