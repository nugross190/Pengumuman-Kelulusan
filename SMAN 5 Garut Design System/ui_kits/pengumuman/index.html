<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengumuman Kelulusan — SMAN 5 Garut · UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #FDF8F0;
    color: #1C1410;
    min-height: 100dvh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(ellipse at top right, rgba(196,30,30,0.05), transparent 55%),
      radial-gradient(ellipse at bottom left, rgba(212,168,15,0.06), transparent 55%);
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
    position: relative;
    z-index: 1;
  }
  .wrap.wide { max-width: 1100px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes sealIn {
    0% { opacity: 0; transform: scale(2) rotate(-20deg); }
    60% { opacity: 1; transform: scale(0.92) rotate(-5deg); }
    100% { opacity: 1; transform: scale(1) rotate(-3deg); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Letterhead.jsx"></script>
<script type="text/babel" src="LoginCard.jsx"></script>
<script type="text/babel" src="ResultLetter.jsx"></script>
<script type="text/babel" src="AdminPanel.jsx"></script>

<script type="text/babel">
function App() {
  const [view, setView] = React.useState('login');   // 'login' | 'result' | 'admin'
  const [studentData, setStudentData] = React.useState(null);
  const [isWide, setIsWide] = React.useState(false);

  function handleLogin(res) {
    if (res.role === 'admin') {
      setIsWide(true);
      setView('admin');
    } else {
      setStudentData(res.data);
      setView('result');
    }
  }

  function handleBack() {
    setView('login');
    setStudentData(null);
    setIsWide(false);
  }

  return React.createElement('div', { className: `wrap${isWide ? ' wide' : ''}` },
    React.createElement(Letterhead),
    React.createElement('div', { style: { marginTop: 28 } },
      view === 'login' && React.createElement(LoginCard, { onLogin: handleLogin }),
      view === 'result' && studentData && React.createElement(ResultLetter, { rec: studentData, onBack: handleBack }),
      view === 'admin' && React.createElement(AdminPanel, { onBack: handleBack }),
    ),
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
